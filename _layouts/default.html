<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Moazzam Rafi">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="robots" content="index, follow">
  <title>{{ page.title | default: site.title | escape }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% if page.page_css %}
  <link rel="stylesheet" href="{{ page.page_css | relative_url }}">
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body class="{{ page.body_class }}">
  {% include site-header.html %}
  <main class="{{ page.main_class }}">
    {{ content }}
  </main>
  {% include site-footer.html %}
</body>
</html>
